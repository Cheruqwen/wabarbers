<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PitStop 87</title>
<meta name="description" content="Book a car wash, carpet cleaning, car service, haircut or nails, with pickup and drop-off. Track your booking live.">
<meta name="theme-color" content="#041B34">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/public.css">
<script src="config.js"></script>
<script type="module" src="assets/public.js"></script>
</head>
<body>
<header class="top" id="top">
  <div class="wrap wide">
    <a class="brand" href="./" id="home-link"><span class="mark" aria-hidden="true"></span><div id="brand-txt"><b id="biz">PitStop 87</b><small id="hd-sub" hidden></small></div></a>
    <div class="hd-right"><a class="hd-btn" id="hd-wa" target="_blank" rel="noopener" hidden>WhatsApp us</a></div>
  </div>
</header>
<div class="banner" id="banner" hidden><div class="wrap wide" id="banner-in"></div></div>
<div class="shell wrap wide">
  <main id="app" class="pub" aria-busy="true">
    <div class="sk-tiles"><div class="sk"></div><div class="sk"></div></div><div class="sk sk-step short"></div>
  </main>
  <aside class="paybar" id="paybar" aria-label="Your booking" hidden><div class="pb-in"></div></aside>
</div>
<footer class="foot"><div class="wrap wide" id="foot"></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">Turn on JavaScript to book online, or message us on WhatsApp.</p></noscript>
</body>
</html>
