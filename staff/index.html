<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pitstop Staff</title>
<meta name="theme-color" content="#041B34">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<script src="../config.js"></script>
<script type="module" src="../assets/staff.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><b id="biz">PitStop 87</b><small id="role">Staff</small></div></div>
    <div class="hd-right"><div class="sync" id="sync" hidden><i></i><span>Live</span></div><button class="hd-btn" id="signout" data-act="signout" hidden>Sign out</button></div>
  </div>
</header>
<div class="banner" id="banner" hidden><div class="wrap" id="banner-in"></div></div>
<nav class="tabs" id="tabs" aria-label="Sections" hidden><div class="wrap"></div></nav>
<main class="wrap" id="view"><p class="loading">Opening the pit wall…</p></main>
<button class="fab" id="fab" data-act="new" hidden><span aria-hidden="true">+</span>New booking</button>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
